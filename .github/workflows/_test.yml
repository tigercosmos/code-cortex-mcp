# Reusable: unit + integration tests on all platforms
name: Test

on:
  workflow_call:
    inputs:
      skip_perf:
        description: 'Skip incremental perf tests (phases 2-7)'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test-unix:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
          - os: macos-14
            cc: cc
            cxx: c++
          - os: macos-15-intel
            cc: cc
            cxx: c++
    runs-on: ${{ matrix.os }}
    # The ubuntu-24.04-arm leg runs the same suite ~6x slower than its x86
    # sibling (9.5 min vs ~60) and has been finishing within a minute of a
    # 60-minute ceiling for weeks — 59.3 min on 2026-08-01, 59.9 on 2026-08-10 —
    # so the next test added anywhere in the suite was always going to cancel
    # it, as one did on 2026-08-15. Raised for headroom; the arm/x86 gap itself
    # is unexplained and worth its own investigation, since nothing about this
    # suite should be architecture-sensitive by that factor.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install deps (Ubuntu)
        if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Test
        run: scripts/test.sh CC=${{ matrix.cc }} CXX=${{ matrix.cxx }}
        env:
          CBM_SKIP_PERF: ${{ inputs.skip_perf && '1' || '' }}

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: CLANG64
          path-type: inherit
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-compiler-rt
            mingw-w64-clang-x86_64-zlib
            make

      - name: Test
        shell: msys2 {0}
        run: scripts/test.sh CC=clang CXX=clang++
        env:
          CBM_SKIP_PERF: ${{ inputs.skip_perf && '1' || '' }}
