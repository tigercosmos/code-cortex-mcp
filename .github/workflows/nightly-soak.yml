# Weekly soak test: 4h sustained load + ASan leak detection
name: Nightly Soak

on:
  schedule:
    - cron: '0 2 * * 0' # Every Sunday at 2am UTC
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: 'Soak duration in minutes (default: 240 = 4h)'
        type: number
        default: 240

permissions:
  contents: read

jobs:
  soak:
    uses: ./.github/workflows/_soak.yml
    with:
      duration_minutes: ${{ inputs.duration_minutes || 240 }}
      # Must clear the soak above with room for checkout, msys2 setup and the
      # build. _soak.yml's default (40) is sized for the 10-minute dry-run soak
      # and would cancel this one part-way through, as it did for all 13
      # scheduled runs before this was passed. 280 leaves the 4h soak 40 minutes
      # of headroom and stays inside the 6h hosted-runner limit.
      quick_timeout_minutes: 280
      run_asan: true
